version: "3"

services:

  sonar-sever:
    image: "sonarqube:9.9-community"
    container_name: "sonar-server"
    restart: unless-stopped
    volumes:
      - ${HOME}/sonarqube_data:/opt/sonarqube/data
      - ${HOME}/sonarqube_logs:/opt/sonarqube/logs
      - ${HOME}/sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "9000:9000"
    networks:
      - casestudy

  redis-client:
    image: "redis"
    container_name: "redis_covidstat"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ${HOME}/redis_data:/data
    command: redis-server --appendonly yes

    networks:
      - casestudy

  jenkins-server:
    build:
      dockerfile: Dockerfile-jenkinsserver
      context: .
    container_name: "jenkins_covidstat"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/jenkins-data:/var/jenkins_home
#   to avoid csrf token issue, when connecting to VM instance using IAP
    environment:
      - JAVA_OPTS=-Djenkins.model.Jenkins.crumbIssuerProxyCompatibility=true -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
    user: root
    ports:
      - "8081:8080"
    networks:
      - casestudy

# Stores the logs shipped by fileBeat
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - casestudy

  # UI tool to lookup logs
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"   # REQUIRED (to access UI)
    networks:
      - casestudy

# To ship the application logs to Elastic search (storage for logs)
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    depends_on:
      - elasticsearch
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - casestudy

networks:
  casestudy:
    external: true

volumes:
  redis_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  es-data:
  filebeat-data: